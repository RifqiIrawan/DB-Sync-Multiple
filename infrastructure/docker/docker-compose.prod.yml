# DBSync - PRODUCTION (contoh). Pakai bersama file inti:
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml up -d --build
# Secret (.env) HARUS di luar repository. Port PostgreSQL/Kafka tidak diekspos.
name: dbsync

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DBSYNC_PG_PASSWORD:?isi DBSYNC_PG_PASSWORD}
  kafka:
    ports: !reset []
  kafka-connect:
    ports: !reset []

  api:
    build: { context: ../../backend, dockerfile: Dockerfile, target: api }
    container_name: dbsync-api
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"   # percaya X-Forwarded-* dari Nginx (IP asli untuk audit & rate limit)
      ConnectionStrings__ConfigDb: Host=postgres;Port=5432;Database=dbsync;Username=dbsync;Password=${DBSYNC_PG_PASSWORD}
      Jwt__SigningKey: ${DBSYNC_JWT_KEY:?isi DBSYNC_JWT_KEY (>=32 karakter)}
      Security__CurrentKeyVersion: v1
      Security__MasterKeys__v1: ${DBSYNC_MASTER_KEY:?isi DBSYNC_MASTER_KEY (base64 32 byte)}
      Seed__AdminPassword: ${DBSYNC_ADMIN_PASSWORD:?isi DBSYNC_ADMIN_PASSWORD}
      Cors__Origins__0: ${DBSYNC_PUBLIC_URL:-https://localhost:18443}
      Worker__Embedded: "false"
      Cdc__Enabled: ${DBSYNC_CDC_ENABLED:-false}
      Cdc__KafkaBootstrap: kafka:19092
      Cdc__KafkaConnectUrl: http://kafka-connect:8083

  worker:
    build: { context: ../../backend, dockerfile: Dockerfile, target: worker }
    container_name: dbsync-worker
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__ConfigDb: Host=postgres;Port=5432;Database=dbsync;Username=dbsync;Password=${DBSYNC_PG_PASSWORD}
      Security__CurrentKeyVersion: v1
      Security__MasterKeys__v1: ${DBSYNC_MASTER_KEY}
      Cdc__Enabled: ${DBSYNC_CDC_ENABLED:-false}
      Cdc__KafkaBootstrap: kafka:19092
      Cdc__KafkaConnectUrl: http://kafka-connect:8083

  frontend:
    build:
      context: ../../frontend
      args: { NUXT_PUBLIC_API_BASE: ${DBSYNC_PUBLIC_URL:-https://localhost:18443} }
    container_name: dbsync-frontend
    restart: unless-stopped

  proxy:
    image: nginx:1.27
    container_name: dbsync-proxy
    restart: unless-stopped
    depends_on: [api, frontend]
    ports: ["${DBSYNC_HTTP_PORT:-18088}:80", "${DBSYNC_HTTPS_PORT:-18443}:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro      # letakkan fullchain.pem & privkey.pem
